<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf5">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="喵喵打卡">
<meta name="format-detection" content="telephone=no">
<title>奶糕 3.0 预览版 · 学习陪伴工作台</title>
<style>
#previewLoadError{position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fff3f5;border:1px solid #efb9c8;border-radius:14px;padding:10px 12px;color:#7b4455;font:600 13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;box-shadow:0 8px 24px rgba(116,69,84,.12)}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/yukih1134/yukih1134.github.io@5f8c2a3e4753be0bf25c6d2cb2c496557ed16361/styles.css" onerror="document.getElementById('previewLoadError').hidden=false">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/yukih1134/yukih1134.github.io@5f8c2a3e4753be0bf25c6d2cb2c496557ed16361/styles-v3.css" onerror="document.getElementById('previewLoadError').hidden=false">
</head>
<body>
<div id="previewLoadError" hidden>3.0 预览资源没有完整加载。请刷新页面；如果仍然看到这条提示，把截图发给我。</div>
<div id="orientationFrame" class="orientation-frame">
<div class="app-shell">
  <aside class="sidebar"><nav id="nav"></nav></aside>
  <main class="workspace">
    <header class="hero" aria-label="喵喵的打卡工作台">
      <div class="hero-copy"><h1>奶糕 3.0 · 预览</h1><p>真机验收版 · 不影响正式工作台 ♡</p></div>
      <div class="pig-family" aria-hidden="true"><span>🐱</span><span>🐾</span><span>💗</span><span>🐱</span></div>
      <div class="cloud hero-cloud-1"></div><div class="cloud hero-cloud-2"></div><div class="hill hero-hill-1"></div><div class="hill hero-hill-2"></div>
    </header>
    <section id="page" class="page" aria-live="polite"></section>
  </main>
  <button id="rotateSide" class="rotate-side" aria-label="切换横屏方向" title="切换横屏方向">↻</button>
  <div id="landscapeHint" class="landscape-hint">已自动适配横屏 · 方向相反可点 ↻</div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
</div>
<input id="importInput" type="file" accept="application/json" hidden>
<script src="https://cdn.jsdelivr.net/gh/yukih1134/yukih1134.github.io@5f8c2a3e4753be0bf25c6d2cb2c496557ed16361/pet-assets.js" onerror="document.getElementById('previewLoadError').hidden=false"></script>
<script src="https://cdn.jsdelivr.net/gh/yukih1134/yukih1134.github.io@5f8c2a3e4753be0bf25c6d2cb2c496557ed16361/pet-v3-sprite.js" onerror="document.getElementById('previewLoadError').hidden=false"></script>
<script src="https://cdn.jsdelivr.net/gh/yukih1134/yukih1134.github.io@5f8c2a3e4753be0bf25c6d2cb2c496557ed16361/pet-v3-room.js" onerror="document.getElementById('previewLoadError').hidden=false"></script>
<script>window.MIAOMIAO_PREVIEW_MODE=true;</script>
<script src="https://cdn.jsdelivr.net/gh/yukih1134/yukih1134.github.io@5f8c2a3e4753be0bf25c6d2cb2c496557ed16361/app.js" onerror="document.getElementById('previewLoadError').hidden=false"></script>
<script>
setTimeout(function(){
  var ok=document.querySelector('.v3-home,.v3-page,.v3-pet-page');
  if(!ok) document.getElementById('previewLoadError').hidden=false;
},2500);
</script>
</body>
</html>
